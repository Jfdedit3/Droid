plugins {
    id 'com.android.application'
}

android {
    namespace 'com.droiddeck.shortcuts'
    compileSdk 34

    defaultConfig {
        applicationId 'com.droiddeck.shortcuts.xclipse920'
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 3
        versionName '3'
    }

    sourceSets.main.java.srcDir('src/protocol/java')

    signingConfigs {
        testkey {
            storeFile file(System.getenv("DROIDDECK_KEYSTORE") ?: "${rootDir}/keystore/xclipse920.p12")
            storeType 'PKCS12'
            storePassword System.getenv('DROIDDECK_SIGNING_PASSWORD')
            keyAlias 'xclipse920'
            keyPassword System.getenv('DROIDDECK_SIGNING_PASSWORD')
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.testkey }
        release {
            minifyEnabled false
            signingConfig signingConfigs.testkey
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
